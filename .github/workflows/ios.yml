name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: alex_browser
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: alex_browser/ios
        run: pod install --repo-update

      # No Apple Developer certificate, provisioning profile, or signing
      # secret is used anywhere in this workflow or repository. The Xcode
      # project (ios/Runner.xcodeproj) is already configured with
      # CODE_SIGNING_ALLOWED=NO / CODE_SIGNING_REQUIRED=NO, so this always
      # produces a genuinely unsigned build regardless of the runner's
      # local Xcode/keychain state.
      - name: Build unsigned iOS app
        working-directory: alex_browser
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 --build-number=1

      # `flutter build ios --no-codesign` leaves Runner.app's main
      # executable AND every nested plugin/engine .framework (Flutter,
      # App, flutter_inappwebview, sqflite, permission_handler,
      # connectivity_plus, open_filex, url_launcher, package_info_plus,
      # etc — one per CocoaPods pod, since the Podfile uses
      # `use_frameworks!`) completely unsigned.
      #
      # Some re-signing tools (including some ESign builds/versions) only
      # re-sign the top-level Runner binary and do not walk into
      # Frameworks/*.framework to sign each one individually. iOS's
      # dynamic linker verifies the code signature of every loaded
      # framework at launch, so a Runner binary that got a fresh
      # signature sitting next to a dozen still-unsigned engine/plugin
      # frameworks fails that verification and the process is killed
      # before the first frame is drawn — a black screen with no visible
      # crash UI. Ad-hoc signing every nested framework here (with `-`,
      # meaning "sign with no identity, just make the signature
      # structurally consistent") means that by the time ESign re-signs
      # the outer bundle, every binary inside already carries a valid,
      # coherent signature shape, regardless of which specific re-signing
      # tool or option is used downstream.
      - name: Ad-hoc sign nested frameworks
        working-directory: alex_browser
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ -d "$APP_PATH/Frameworks" ]; then
            # Sign innermost items first (dylibs, then each .framework's own
            # binary), one at a time and WITHOUT --deep. --deep is explicitly
            # discouraged by Apple for anything other than a quick sanity
            # signature: it silently skips or mis-signs nested bundles that
            # have their own Frameworks/Resources layout, which is exactly
            # what several of these plugin frameworks have. Signing each
            # .framework individually guarantees every one of them ends up
            # with its own valid, independent signature.
            find "$APP_PATH/Frameworks" -name "*.dylib" -print0 | while IFS= read -r -d '' item; do
              echo "Signing dylib: $item"
              codesign --force --sign - "$item"
            done

            find "$APP_PATH/Frameworks" -name "*.framework" -print0 | while IFS= read -r -d '' item; do
              echo "Signing framework: $item"
              codesign --force --sign - "$item"
            done
          fi

          # Re-sign the main app bundle last, WITHOUT --deep, now that every
          # nested framework already carries its own real signature. Using
          # --deep here would re-walk and could re-write the nested
          # signatures we just verified above.
          codesign --force --sign - "$APP_PATH"

          echo "Verifying signature structure:"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

          echo "Checking for any unsigned or invalid nested binaries:"
          find "$APP_PATH/Frameworks" -name "*.framework" -print0 2>/dev/null | while IFS= read -r -d '' fw; do
            codesign --verify --verbose=2 "$fw"
          done

      # A real .ipa is just that .app repackaged into the Payload/ folder
      # structure Apple's installer expects — this is the correct,
      # standard way to produce an unsigned (well: ad-hoc signed) IPA
      # from Flutter when no Apple signing identity is available in CI.
      - name: Package unsigned IPA
        working-directory: alex_browser
        run: |
          set -e
          BUILD_DIR="build/ios/iphoneos"
          APP_PATH="$BUILD_DIR/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi

          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/Runner.app"

          cd "$BUILD_DIR"
          zip -r -X AlexBrowser.ipa Payload -x ".*"
          cd -

          mkdir -p build/ios/ipa_output
          mv "$BUILD_DIR/AlexBrowser.ipa" build/ios/ipa_output/AlexBrowser.ipa

      - name: Locate build output
        working-directory: alex_browser
        run: ls -la build/ios/ipa_output/

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: alex-browser-ios-unsigned-ipa
          path: alex_browser/build/ios/ipa_output/AlexBrowser.ipa
          if-no-files-found: error
          retention-days: 30
